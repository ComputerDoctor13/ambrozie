<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Doctor — Monitorizare Aer & Polen</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        :root { --bg-m: #0b0f19; --bg-c: #161c2a; --txt-p: #ffffff; --txt-s: #94a3b8; --neon: #40c057; --b-col: #242f41; }
        body { background-color: var(--bg-m); color: var(--txt-p); font-family: -apple-system, sans-serif; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .app-box { width: 100%; max-width: 440px; background: #0f1422; padding: 20px; box-sizing: border-box; border-radius: 24px; border: 1px solid var(--b-col); }
        .title { font-size: 20px; font-weight: 800; margin-bottom: 20px; } .title span { color: var(--neon); }
        .card, .c-box { background: var(--bg-c); border: 1px solid var(--b-col); border-radius: 16px; padding: 18px; text-align: center; margin-bottom: 15px; }
        .c-lbl { font-size: 11px; font-weight: 700; color: var(--txt-s); text-transform: uppercase; text-align: left; margin-bottom: 8px; }
        .g-box { width: 160px; height: 90px; margin: 10px auto 0 auto; }
        .val { font-size: 36px; font-weight: 800; margin-top: 5px; } .unit { font-size: 12px; color: var(--txt-s); }
        .ind { display: inline-block; padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; color: #fff; margin-top: 10px; }
        .tot-b { font-size: 22px; font-weight: 800; margin: 5px 0 12px 0; text-align: left; } .tot-b span { font-size: 12px; color: var(--txt-s); }
        .ch-cont { width: 100%; height: 130px; position: relative; }
    </style>
</head>
<body>
<div class="app-box">
    <div class="title">Computer<span>Doctor</span></div>
    
    <div class="card">
        <div class="c-lbl">Ambrozie acum</div>
        <div class="g-box">
            <svg width="160" height="90" viewBox="0 0 200 110">
                <path d="M 20 90 A 80 80 0 0 1 50 30" fill="none" stroke="#22c55e" stroke-width="12" stroke-linecap="round"/>
                <path d="M 52 28 A 80 80 0 0 1 100 10" fill="none" stroke="#eab308" stroke-width="12" />
                <path d="M 100 10 A 80 80 0 0 1 148 28" fill="none" stroke="#f97316" stroke-width="12" />
                <path d="M 150 30 A 80 80 0 0 1 180 90" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>
                <g id="needle">
                    <line x1="100" y1="90" x2="20" y2="90" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
                    <circle cx="100" cy="90" r="6" fill="#ffffff" />
                </g>
            </svg>
        </div>
        <div class="val"><span id="p-num">0.0</span> <span class="unit">g/m³</span></div>
        <div class="ind" id="badge-status" style="background-color: #22c55e;">Inexistent</div>
    </div>

    <div class="c-box">
        <div class="c-lbl">Activitate • Ultimele 30 de zile</div>
        <div class="tot-b">1.361 <span>verificări</span></div>
        <div class="ch-cont"><canvas id="chartCanvas"></canvas></div>
    </div>
</div>
<script>
    function getAPI() {
        var url = 'https://open-meteo.com';
        fetch(url).then(function(r){return r.json();}).then(function(d){
            var n = new Date(); var hr = n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')+'T'+String(n.getHours()).padStart(2,'0')+':00';
            var idx = d.hourly.time.indexOf(hr);
            var pVal = d.hourly.ragweed_pollen[idx >= 0 ? idx : 0] || 0;
            document.getElementById('p-num').innerText = pVal.toFixed(1) + ' ';
            var el = document.getElementById('badge-status');
            if(pVal >= 50){el.innerText="Critic"; el.style.background="#ef4444";}
            else if(pVal >= 10){el.innerText="Mediu"; el.style.background="#f97316";}
            else if(pVal >= 1){el.innerText="Scăzut"; el.style.background="#eab308";}
            else{el.innerText="Inexistent"; el.style.background="#22c55e";}
            document.getElementById('needle').setAttribute('transform', 'rotate('+((Math.min(pVal,60)/60)*180)+',100,90)');
        }).catch(function(){});
    }
    window.onload = function() {
        getAPI();
        var ctx = document.getElementById('chartCanvas').getContext('2d');
        var mock = new Array(5, 12, 8, 48, 15, 10);
        chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['18 aug', '24 aug', '30 aug', '3 sept', '11 sept', '16 sept'],
                datasets: [{ data: mock, borderColor: '#40c057', borderWidth: 3, backgroundColor: 'rgba(64,192,87,0.05)', fill: true, tension: 0.4, pointRadius: 4 }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false }, ticks: { color: '#94a3b8' } }, y: { display: false } } }
        });
    };
</script>
</body>
</html>
